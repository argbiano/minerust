[package]
name = "minerust"
version = "0.1.0"
edition = "2024"
description = "A Minecraft: Java Edition 26.3 (protocol 777) server written in Rust"

[dependencies]
anyhow = "1"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
crossbeam-channel = "0.5.17"
flate2 = "1"
horizon-core = { git = "https://github.com/horizon-rust/horizon", rev = "1453e0e614af4b2d04dd0d228a94162b5d459910", version = "0.1.0" }
horizon-world = { git = "https://github.com/horizon-rust/horizon", rev = "1453e0e614af4b2d04dd0d228a94162b5d459910", version = "0.1.0" }
md-5 = "0.11.0"
p384 = { version = "0.14.0", features = ["ecdsa"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
webrtc = "0.21"
zip = { version = "9", default-features = false, features = ["deflate"] }
